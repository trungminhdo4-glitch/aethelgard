[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aethelgard"
version = "0.1.0"
description = "AethelGard MVP1 - B2B Supply Chain Security Platform (NIS-2 Compliance)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "AethelGard Team" },
]
keywords = ["compliance", "nis-2", "supply-chain", "security", "b2b"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "mypy>=1.7",
  "ruff>=0.16.3",
]
pdf = [
  "pypdf==6.14.2",
]
all = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "mypy>=1.7",
  "ruff>=0.16.3",
  "pypdf==6.14.2",
]

[project.urls]
Repository = "https://github.com/trungminhdo4-glitch/aethelgard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM", "PL"]
ignore = [
  "PLR0913",  # too many arguments - we control APIs
  "PLR0917",  # too many positional arguments - controlled internal data flows
  "PLR0915",  # evaluation runner is intentionally linear and auditable
  "PLR2004",  # magic value - we use named constants
  "PLC0415",  # local imports are used intentionally to avoid circular imports
  "RUF022",  # __all__ grouping is part of the public API documentation
  "RUF023",  # __slots__ grouping mirrors constructor semantics
  "SIM117",  # nested unittest contexts are kept for readable subtests
  "UP031",  # project convention prefers percent-style lazy formatting
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_reexport = true
files = ["src", "tests"]

[tool.coverage.run]
source = ["src/aethelgard"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
